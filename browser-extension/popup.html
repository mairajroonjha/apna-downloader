<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-gradient: radial-gradient(circle at 50% 50%, #111827 0%, #0b0f19 100%);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --card-bg: rgba(255, 255, 255, 0.03);
            --accent-color: #3b82f6;
            --success-color: #10b981;
            --failed-color: #ef4444;
        }

        body.theme-light {
            --bg-primary: #f8fafc;
            --bg-gradient: radial-gradient(circle at 50% 50%, #ffffff 0%, #f8fafc 100%);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-bg: #ffffff;
        }

        body {
            width: 340px;
            max-height: 480px;
            margin: 0;
            padding: 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            background: var(--bg-gradient);
            color: var(--text-main);
            user-select: none;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-img {
            width: 22px;
            height: 22px;
        }

        .logo-text {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-main);
        }

        .logo-text span {
            background: linear-gradient(135deg, var(--accent-color) 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #9ca3af;
        }

        .status-dot.connected { background: var(--success-color); box-shadow: 0 0 6px var(--success-color); }
        .status-dot.disconnected { background: var(--failed-color); box-shadow: 0 0 6px var(--failed-color); }

        /* Media Sniffer Tabs */
        .tab-bar {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 6px 2px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            text-align: center;
        }

        .tab-btn.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }

        /* Items Container */
        .media-list {
            flex: 1;
            max-height: 260px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 2px;
        }

        .media-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 11px;
            gap: 8px;
        }

        .media-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }

        .media-title {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .media-sub {
            font-size: 9px;
            color: var(--text-muted);
        }

        .btn-download-item {
            padding: 4px 10px;
            background: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-download-item:hover {
            opacity: 0.9;
        }

        .action-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
        }

        .btn-download-all {
            width: 100%;
            padding: 7px 12px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 24px 10px;
            color: var(--text-muted);
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-box">
            <img class="logo-img" src="icon48.png" alt="Logo">
            <div class="logo-text">Apna <span>Dowanloader</span></div>
        </div>
        <div class="status-badge">
            <div id="connection-dot" class="status-dot"></div>
            <span id="connection-text">Checking</span>
        </div>
    </div>

    <!-- Media Tabs -->
    <div class="tab-bar">
        <button class="tab-btn active" id="tab-vids">🎥 Videos (<span id="cnt-vids">0</span>)</button>
        <button class="tab-btn" id="tab-auds">🎵 Audios (<span id="cnt-auds">0</span>)</button>
        <button class="tab-btn" id="tab-imgs">🖼️ Images (<span id="cnt-imgs">0</span>)</button>
        <button class="tab-btn" id="tab-docs">📄 Docs (<span id="cnt-docs">0</span>)</button>
    </div>

    <!-- List Box -->
    <div class="media-list" id="media-list-container">
        <div class="empty-state">Scanning page for downloadable media...</div>
    </div>

    <div class="action-footer">
        <button class="btn-download-all" id="btn-download-all-items">Download All Items with Apna</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
