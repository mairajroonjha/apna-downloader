<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download File Info</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-main);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }
        .info-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            background: var(--bg-card);
        }
        .modal-body-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            gap: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body class="theme-light">
    <div class="info-container">
        <div class="modal-header" style="border-bottom: 1px solid var(--border-color); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;">
            <h2><i class="fa-solid fa-file-invoice"></i> Download File Info</h2>
        </div>
        
        <div class="modal-body-wrapper">
            <!-- Main Form Section -->
            <div class="modal-main-form" style="flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0;">
                <div class="form-group">
                    <label for="input-url">URL</label>
                    <input type="text" id="input-url" placeholder="Paste link address here (HTTP/HTTPS)" style="width: 100%; box-sizing: border-box;" readonly>
                </div>
                
                <div class="form-group">
                    <label for="select-category">Category</label>
                    <select id="select-category" style="width: 100%; box-sizing: border-box;">
                        <option value="videos">Videos</option>
                        <option value="music">Music</option>
                        <option value="compressed">Compressed</option>
                        <option value="documents">Documents</option>
                        <option value="programs">Programs</option>
                        <option value="webpages">Web Pages</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="input-save-path">Save As</label>
                    <div class="input-with-button" style="display: flex; gap: 8px; width: 100%;">
                        <input type="text" id="input-save-path" readonly placeholder="Choose where to save file..." style="flex: 1; min-width: 0; box-sizing: border-box;">
                        <button id="btn-browse-folder" class="btn secondary" style="padding: 8px 12px; white-space: nowrap;">...</button>
                    </div>
                </div>

                <div class="form-group" style="gap: 4px;">
                    <label class="checkbox-label" style="display: flex; align-items: center; gap: 6px; cursor: pointer; text-transform: none; font-weight: normal; font-size: 11px; color: var(--text-muted);">
                        <input type="checkbox" id="chk-remember-path" checked>
                        <span>Remember this path for "<span id="lbl-category-name">other</span>" category</span>
                    </label>
                    <input type="text" id="input-category-path" readonly class="category-path-display" style="width: 100%; box-sizing: border-box;" value="">
                </div>

                <div class="form-group">
                    <label for="input-description">Description</label>
                    <input type="text" id="input-description" placeholder="Enter optional description here..." style="width: 100%; box-sizing: border-box;">
                </div>
                
                <div class="form-group">
                    <label for="connections-count">Parallel Threads</label>
                    <select id="connections-count" style="width: 100%; box-sizing: border-box; padding: 8px 10px;">
                        <option value="1">1 Thread (Single connection)</option>
                        <option value="2">2 Threads</option>
                        <option value="4">4 Threads</option>
                        <option value="8" selected>8 Threads (Recommended)</option>
                        <option value="16">16 Threads</option>
                        <option value="32">32 Threads (High-bandwidth)</option>
                    </select>
                </div>

                <div class="form-group" id="yt-subtitles-group" style="margin-top: 5px; display: none;">
                    <label class="checkbox-label" style="display: flex; align-items: center; gap: 6px; cursor: pointer; text-transform: none; font-weight: normal; font-size: 11px; color: var(--text-muted);">
                        <input type="checkbox" id="chk-download-subtitles">
                        <span>Download Subtitles (SRT) if available</span>
                    </label>
                </div>
            </div>

            <!-- Right Side panel with file icon & size -->
            <div class="modal-side-panel" style="width: 150px; display: flex; flex-direction: column; align-items: center; gap: 15px; border-left: 1px solid var(--border-color); padding-left: 20px; box-sizing: border-box; justify-content: center;">
                <div class="file-type-icon-wrapper" id="side-icon-container" style="width: 80px; height: 80px; border-radius: 12px; background: rgba(255, 255, 255, 0.03); display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color);">
                    <i class="fa-solid fa-file" id="side-file-icon" style="font-size: 32px; color: var(--accent-color);"></i>
                </div>
                <div style="text-align: center;">
                    <div class="file-size-label" style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px;">File Size:</div>
                    <div class="file-size-display" id="side-file-size" style="font-size: 18px; font-weight: 700; color: var(--text-main);">Unknown</div>
                </div>
            </div>
        </div>

        <div class="modal-footer" style="border-top: 1px solid var(--border-color); padding: 12px 20px; display: flex; justify-content: flex-end; gap: 12px; background: rgba(0, 0, 0, 0.08);">
            <button id="btn-add-later" class="btn secondary" style="min-width: 110px; justify-content: center;">Download Later</button>
            <button id="btn-add-start" class="btn primary" disabled style="min-width: 120px; justify-content: center;">Start Download</button>
            <button id="btn-add-cancel" class="btn text" style="min-width: 80px; justify-content: center;">Cancel</button>
        </div>
    </div>

    <script src="info.js"></script>
</body>
</html>
