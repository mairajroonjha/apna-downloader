<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download File Info</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary, #0b0f19);
            color: var(--text-main, #f3f4f6);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }
        .info-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            background: var(--bg-secondary, #111827);
        }
        .modal-header {
            border-bottom: 1px solid var(--border-color, rgba(255,255,255,0.08));
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.15);
        }
        .modal-header h2 {
            font-size: 15px;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main, #f3f4f6);
        }
        .modal-header h2 i {
            color: #3b82f6;
        }
        .modal-body-wrapper {
            flex: 1;
            overflow: hidden;
            padding: 16px 18px;
            display: flex;
            gap: 16px;
            box-sizing: border-box;
        }
        .modal-main-form {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
            overflow-y: auto;
            padding-right: 4px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted, #9ca3af);
        }
        .form-group input[type="text"],
        .form-group select {
            width: 100%;
            padding: 7px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color, rgba(255,255,255,0.12));
            background: rgba(0, 0, 0, 0.25);
            color: var(--text-main, #f3f4f6);
            font-size: 12px;
            outline: none;
            box-sizing: border-box;
        }
        .form-group input[type="text"]:focus,
        .form-group select:focus {
            border-color: #3b82f6;
        }
        .modal-side-panel {
            width: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border-left: 1px solid var(--border-color, rgba(255,255,255,0.08));
            padding-left: 16px;
            box-sizing: border-box;
        }
        .file-card-box {
            width: 100%;
            padding: 16px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color, rgba(255,255,255,0.08));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
        }
        .file-type-icon-wrapper {
            width: 54px;
            height: 54px;
            border-radius: 10px;
            background: rgba(59, 130, 246, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(59, 130, 246, 0.25);
        }
        .file-type-icon-wrapper i {
            font-size: 26px;
            color: #3b82f6;
        }
        .file-size-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted, #9ca3af);
        }
        .file-size-display {
            font-size: 15px;
            font-weight: 700;
            color: #3b82f6;
            word-break: break-word;
        }
        .modal-footer {
            border-top: 1px solid var(--border-color, rgba(255,255,255,0.08));
            padding: 12px 18px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.2);
        }
        .btn-action-primary {
            padding: 8px 18px;
            background: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .btn-action-primary:hover:not(:disabled) {
            background: #2563eb;
        }
        .btn-action-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-action-secondary {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main, #f3f4f6);
            border: 1px solid var(--border-color, rgba(255,255,255,0.15));
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .btn-action-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.14);
        }
        .btn-action-cancel {
            padding: 8px 14px;
            background: transparent;
            color: var(--text-muted, #9ca3af);
            border: 1px solid transparent;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.15s ease;
        }
        .btn-action-cancel:hover {
            color: var(--text-main, #ffffff);
        }
    </style>
</head>
<body class="theme-dark">
    <div class="info-container">
        <div class="modal-header">
            <h2><i class="fa-solid fa-file-arrow-down"></i> Download File Info</h2>
        </div>
        
        <div class="modal-body-wrapper">
            <!-- Main Form Section -->
            <div class="modal-main-form">
                <div class="form-group">
                    <label for="input-url">URL</label>
                    <input type="text" id="input-url" placeholder="Paste link address here (HTTP/HTTPS)" readonly>
                </div>
                
                <div class="form-group">
                    <label for="select-category">Category</label>
                    <select id="select-category">
                        <option value="videos">Videos</option>
                        <option value="music">Music</option>
                        <option value="compressed">Compressed</option>
                        <option value="documents">Documents</option>
                        <option value="programs">Programs</option>
                        <option value="webpages">Web Pages</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="input-save-path">Save As</label>
                    <div style="display: flex; gap: 8px; width: 100%;">
                        <input type="text" id="input-save-path" readonly placeholder="Choose destination folder..." style="flex: 1; min-width: 0;">
                        <button id="btn-browse-folder" class="btn-action-secondary" style="padding: 6px 12px;" data-tooltip="Browse download folder" data-tooltip-placement="top">...</button>
                    </div>
                </div>

                <div class="form-group" style="gap: 4px;">
                    <label class="checkbox-label" style="display: flex; align-items: center; gap: 6px; cursor: pointer; text-transform: none; font-weight: normal; font-size: 11px; color: var(--text-muted);">
                        <input type="checkbox" id="chk-remember-path" checked>
                        <span>Remember this path for "<span id="lbl-category-name">videos</span>" category</span>
                    </label>
                    <input type="text" id="input-category-path" readonly class="category-path-display" value="">
                </div>

                <div class="form-group">
                    <label for="input-description">Description</label>
                    <input type="text" id="input-description" placeholder="Enter optional description here...">
                </div>
                
                <div class="form-group">
                    <label for="connections-count">Parallel Threads</label>
                    <select id="connections-count">
                        <option value="1">1 Thread (Single connection)</option>
                        <option value="2">2 Threads</option>
                        <option value="4">4 Threads</option>
                        <option value="8" selected>8 Threads (Recommended)</option>
                        <option value="16">16 Threads</option>
                        <option value="32">32 Threads (High-bandwidth)</option>
                    </select>
                </div>

                <div class="form-group" id="yt-subtitles-group" style="display: none;">
                    <label class="checkbox-label" style="display: flex; align-items: center; gap: 6px; cursor: pointer; text-transform: none; font-weight: normal; font-size: 11px; color: var(--text-muted);">
                        <input type="checkbox" id="chk-download-subtitles">
                        <span>Download Subtitles (SRT) if available</span>
                    </label>
                </div>
            </div>

            <!-- Right Side panel with file icon & size -->
            <div class="modal-side-panel">
                <div class="file-card-box">
                    <div class="file-type-icon-wrapper" id="side-icon-container">
                        <i class="fa-solid fa-file" id="side-file-icon"></i>
                    </div>
                    <div>
                        <div class="file-size-label">File Size</div>
                        <div class="file-size-display" id="side-file-size">Loading...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button id="btn-add-later" class="btn-action-secondary" data-tooltip="Queue download to list without starting immediately">Download Later</button>
            <button id="btn-add-start" class="btn-action-primary" disabled data-tooltip="Start downloading file now">Start Download</button>
            <button id="btn-add-cancel" class="btn-action-cancel">Cancel</button>
        </div>
    </div>

    <script src="ux-utils.js" type="module"></script>
    <script src="info.js"></script>
</body>
</html>
